<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Little Grand Prix app icon. Full-bleed square: iOS and Android round the corners themselves.
       Everything important sits inside the central 80% circle, so it also works as a maskable icon. -->
  <rect width="512" height="512" fill="#D7261E"/>
  <circle cx="256" cy="256" r="196" fill="#2B3038"/>
  <!-- kerb band across the bottom of the track circle -->
  <clipPath id="c"><circle cx="256" cy="256" r="196"/></clipPath>
  <g clip-path="url(#c)">
    <g>
      <rect x="40" y="350" width="440" height="22" fill="#FFFFFF"/>
      <rect x="40" y="350" width="40" height="22" fill="#D7261E"/>
      <rect x="120" y="350" width="40" height="22" fill="#D7261E"/>
      <rect x="200" y="350" width="40" height="22" fill="#D7261E"/>
      <rect x="280" y="350" width="40" height="22" fill="#D7261E"/>
      <rect x="360" y="350" width="40" height="22" fill="#D7261E"/>
      <rect x="440" y="350" width="40" height="22" fill="#D7261E"/>
    </g>
    <!-- chequered flag block, top right -->
    <g transform="translate(296 104)">
      <rect width="104" height="78" fill="#FFFFFF"/>
      <rect x="0" y="0" width="26" height="26" fill="#111"/><rect x="52" y="0" width="26" height="26" fill="#111"/>
      <rect x="26" y="26" width="26" height="26" fill="#111"/><rect x="78" y="26" width="26" height="26" fill="#111"/>
      <rect x="0" y="52" width="26" height="26" fill="#111"/><rect x="52" y="52" width="26" height="26" fill="#111"/>
    </g>
    <rect x="286" y="100" width="10" height="128" rx="5" fill="#C9CFD6"/>
    <!-- 1 + 2 -->
    <text x="104" y="190" font-family="Fredoka, 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="700" font-size="78" fill="#F4C20D">1+2</text>
  </g>
  <!-- the race car (same drawing as the app, scaled) -->
  <g transform="translate(70 214) scale(2.9)">
    <rect x="5" y="9" width="17" height="6" rx="2" fill="#D7261E" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="11" y="14" width="5" height="15" fill="#FFFFFF"/>
    <path d="M10 33c0-5 6-8 14-8l26-1 10-9c3-3 6-3 10-2l10 2 6 9 24 4c6 1 9 4 9 8v3H10z" fill="#D7261E" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="69" cy="17" r="6.5" fill="#F4C20D" stroke="#1B1E23" stroke-width="2"/>
    <rect x="69" y="14" width="7" height="4" rx="2" fill="#1B1E23"/>
    <rect x="103" y="36" width="21" height="5" rx="2" fill="#D7261E" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="44" cy="31" r="7.5" fill="#FFFFFF" stroke="#1B1E23" stroke-width="1.5"/>
    <text x="44" y="31.5" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, Arial, sans-serif" font-weight="700" font-size="11" fill="#111">5</text>
    <circle cx="29" cy="41" r="12" fill="#1B1E23" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="29" cy="41" r="4.5" fill="#A3ACB7"/>
    <circle cx="97" cy="42" r="11" fill="#1B1E23" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="97" cy="42" r="4" fill="#A3ACB7"/>
  </g>
</svg>
